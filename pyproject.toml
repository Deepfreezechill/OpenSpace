[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scion-skills"
version = "2.0.0"
description = "Scion — Self-Evolving AI Skill Engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Scion Team@HKUDS"}
]

dependencies = [
    "litellm>=1.83.0,<2",  # >=1.83.0 fixes CVE-2026-35029 + CVE-2026-35030; skips PYSEC-2026-2 (1.82.7/1.82.8 malicious)
    "python-dotenv>=1.0.0,<2",
    "openai>=1.0.0,<3",
    "jsonschema>=4.20.0,<5",  # >=4.20.0 for compatibility with litellm's pinned version
    "mcp>=1.0.0,<2",
    "anthropic>=0.71.0,<1",
    "pillow>=11.0.0,<13",
    "numpy>=1.24.0,<3",
    "colorama>=0.4.6,<1",
    "flask>=3.1.0,<4",
    "pydantic>=2.12.0,<3",
    "prometheus-client>=0.21.0,<1",
    "requests>=2.32.0,<3",
    "structlog>=24.0.0,<26",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core>=12.0,<13",
    "pyobjc-framework-cocoa>=12.0,<13",
    "pyobjc-framework-quartz>=12.0,<13",
    "atomacos>=3.2.0,<4",
]

linux = [
    "python-xlib>=0.33,<1",
    "pyatspi>=2.38.0,<3",
    "numpy>=1.24.0,<3",
]

windows = [
    "pywinauto>=0.6.8,<1",
    "pywin32>=306,<400",
    "PyGetWindow>=0.0.9,<1",
]

dev = [
    "pytest>=7.0.0,<10",
    "pytest-asyncio>=0.21.0,<2",
    "pytest-timeout>=2.2.0,<3",
    "pytest-cov>=4.0.0,<8",
    "ruff>=0.5.0,<1",
    "mypy>=1.0.0,<2",
]

gui = [
    "pyautogui>=0.9.54,<1",
]

all = [
    "scion-skills[dev,gui]",
]

[project.urls]
Repository = "https://github.com/Deepfreezechill/scion"
"Bug Tracker" = "https://github.com/Deepfreezechill/scion/issues"

[project.scripts]
scion = "scion.__main__:run_main"
scion-server = "scion.local_server.main:main"
scion-mcp = "scion.mcp_server:run_mcp_server"
scion-download-skill = "scion.cloud.cli.download_skill:main"
scion-upload-skill = "scion.cloud.cli.upload_skill:main"
scion-dashboard = "scion.dashboard_server:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length handled separately
    "E402",   # module-import-not-at-top (upstream code pattern)
    "E701",   # multiple-statements-on-one-line (upstream)
    "E711",   # none-comparison (upstream)
    "E712",   # true-false-comparison (upstream)
    "E722",   # bare-except (upstream code, fix incrementally)
    "E741",   # ambiguous-variable-name (upstream)
    "F401",   # unused-import (upstream, fix incrementally)
    "F403",   # undefined-local-with-import-star (upstream)
    "F405",   # undefined-local-with-import-star-usage (upstream)
    "F811",   # redefined-while-unused (upstream)
    "F821",   # undefined-name (upstream — missing imports in abstract ports)
    "F841",   # unused-variable (upstream, fix incrementally)
]

[tool.ruff.lint.per-file-ignores]
"gdpval_bench/*" = ["E", "F", "W"]  # benchmark scripts — upstream code

[tool.setuptools]
packages = {find = {where = ["."], include = ["scion*"]}}

[tool.setuptools.package-data]
scion = [
    "config/*.json",
    "config/*.json.example",
    "local_server/config.json",
    "local_server/README.md",
    "security/blocklist.yml",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:openai.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "unit: fast isolated tests (no I/O, no network)",
    "integration: tests that touch real services or filesystem",
    "contract: tests that validate API contracts",
    "property: property-based tests (hypothesis)",
    "statistical: tests with statistical assertions",
    "e2e: end-to-end tests",
    "slow: tests that take > 5 seconds",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["scion"]
omit = [
    "scion/__main__.py",
    "scion/dashboard_server.py",
    "scion/local_server/*",
    "scion/platforms/*",
    "scion/recording/*",
    "tests/*",
]

[tool.coverage.report]
fail_under = 20
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
